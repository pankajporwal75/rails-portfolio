version: "3.9"

services:
  db:
    image: postgres:11
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USERNAME: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: pankaj_portfolio_dev

  web:
    tty: true
    stdin_open: true
    build:
      context: .
      dockerfile: Dockerfile
    command: ./script/start_dev.sh
    depends_on:
      - db
    volumes:
      - .:/backend
    working_dir: /backend
    environment:
      - RAILS_ENV=development
    ports:
      - "3000:3000"

volumes:
  db-data:
    driver: local
  