version: "3.9"

services:
  db:
    image: postgres:11
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pankaj_portfolio_prod

  web:
    image: pankajportfolio:latest
    working_dir: /backend
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      - RAILS_ENV=production
      - DATABASE_URL=postgres://postgres:postgres@db/pankaj_portfolio_dev

volumes:
  db-data:
    driver: local
  